name: MythicIsles
version: 0.1.0
main: org.mythicove.isles.IslesBridge
api-version: '1.21'
description: Verified game identity, member actions and optional Minecraft data for Mythicove.
softdepend: [LuckPerms, PlaceholderAPI, spark, ViaVersion, WorldGuard, Vault, Chunky]
commands:
  mythic:
    description: Link this game identity to a Mythicove website player
    usage: /mythic link <code>
    permission: mythicisles.link
permissions:
  mythicisles.link:
    default: true
