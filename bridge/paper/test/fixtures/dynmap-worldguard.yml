# Explicit world-qualified public regions; [] means ALL regions in this plugin.
visibleregions: ['world/isles_plot']
hiddenregions: []
update:
  period: 2
layer:
  name: 'Public regions'
  hidebydefault: false
use3dregions: false
# Public map popups deliberately omit owners, members, groups and flags.
infowindow: '<div class="infowindow">%regionname%</div>'
regionstyle:
  strokeColor: '#FF0000'
  strokeOpacity: 0.8
  strokeWeight: 3
  fillColor: '#FF0000'
  fillOpacity: 0.35
maxdepth: 16
updates-per-tick: 20
